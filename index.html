<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Trái Tim Nổ Tung 20/10</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.45) blur(1px);
            z-index: 1;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Ảnh nền của bạn -->
    <img id="bg-img" src="https://squarespace-cdn.com" alt="Nền">

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const PARTICLE_COUNT = 10000; 
        const particles = [];
        const stars = [];             
        const flowers = []; // Đổi mảng petals thành flowers           
        const FLOWER_COUNT = 50; // Giảm số lượng hoa xuống một chút để nhìn rõ hình bông hoa rơi sống động

        function getHeartPoint(t, scale = 13) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: x * scale + canvas.width / 2,
                y: y * scale + canvas.height / 2
            };
        }

        class Particle {
            constructor() {
                const t = Math.random() * Math.PI * 2;
                const target = getHeartPoint(t);
                this.targetX = target.x;
                this.targetY = target.y;
                
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                
                this.speed = 0.02 + Math.random() * 0.03;
                this.wanderStrength = 0.5 + Math.random() * 1.5;
                
                const angle = Math.random() * Math.PI * 2;
                const force = 4 + Math.random() * 8;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                this.alpha = 1;

                const r = Math.floor(230 + Math.random() * 25);
                const g = Math.floor(60 + Math.random() * 90);
                const b = Math.floor(140 + Math.random() * 80);
                this.color = {r, g, b};
                this.size = 0.8 + Math.random() * 1.5;
            }

            update() {
                if (!isExploded) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 5) {
                        this.x += (Math.random() - 0.5) * this.wanderStrength;
                        this.y += (Math.random() - 0.5) * this.wanderStrength;
                    } else {
                        this.x += dx * this.speed;
                        this.y += dy * this.speed;
                    }
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.98; 
                    this.vy *= 0.98;
                    this.alpha -= 0.008; 
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class BackgroundStar {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = 0.5 + Math.random() * 1.5;
                this.alpha = Math.random();
                this.speed = 0.005 + Math.random() * 0.01;
            }
            update() {
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // LỚP VẼ BÔNG HOA RƠI 5 CÁNH (Falling Flowers)
        class Flower {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = 4 + Math.random() * 5; // Cỡ bông hoa vừa phải để nhìn rõ
                this.speedY = 1 + Math.random() * 1.5; 
                this.speedX = (Math.random() - 0.5) * 0.8; 
                this.angle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() - 0.5) * 0.02; 

                // Màu hồng hoa đào rực rỡ ngọt ngào
                const g = Math.floor(100 + Math.random() * 60);
                this.color = `rgba(255, ${g}, 160, ${0.5 + Math.random() * 0.4})`;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spinSpeed;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                
                // Thuật toán toán học vẽ bông hoa 5 cánh lãng mạn
                ctx.beginPath();
                const petals = 5;
                for (let i = 0; i < petals; i++) {
                    ctx.rotate((Math.PI * 2) / petals);
                    ctx.ellipse(0, 0 - this.size, this.size * 0.6, this.size, 0, 0, Math.PI * 2);
                }
                ctx.fill();

                // Vẽ nhụy hoa nhỏ màu vàng nhạt ở giữa
                ctx.beginPath();
                ctx.fillStyle = "rgba(255, 240, 150, 0.9)";
                ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        let startTime = Date.now();
        let isExploded = false; 
        let textAlpha = 0;      

        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
        for (let i = 0; i < 100; i++) stars.push(new BackgroundStar());
        for (let i = 0; i < FLOWER_COUNT; i++) flowers.push(new Flower());

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';

            stars.forEach(s => { s.update(); s.draw(); });
            flowers.forEach(f => { f.update(); f.draw(); }); // Vẽ hoa rơi đằng sau

            let elapsed = (Date.now() - startTime) / 1000;
            if (elapsed >= 5 && !isExploded) {
                isExploded = true;
            }

            particles.forEach(p => { p.update(); p.draw(); });

            if (!isExploded) {
                ctx.font = "bold 34px Arial";      
                ctx.fillStyle = "#FFFFFF";         
                ctx.textAlign = "center";          
                ctx.shadowColor = "#FF69B4";       
                ctx.shadowBlur = 15;               
                ctx.fillText("Huyền Trangg~", canvas.width / 2, canvas.height / 2 - 240);
            } else {
                if (textAlpha < 1) textAlpha += 0.01;
                
                ctx.textAlign = "center";
                ctx.shadowBlur = 10;

                ctx.font = "bold 36px Arial";
                ctx.fillStyle = `rgba(255, 105, 180, ${textAlpha})`;
                ctx.shadowColor = "#FF69B4";
                ctx.fillText("20 Tháng 10 ❤️", canvas.width / 2, canvas.height / 2 - 120);

                ctx.font = "bold 18px Arial";
                ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
                ctx.shadowColor = "rgba(0, 0, 0, 0.7)";

                const lines = [
                    "em kh biec đã đến 20 tháng 10 chưa",
                    "nhưng e chúc chị 1 ngày 20 tháng 10 vui vẻ",
                    "kh buồn nựa ăn đầy đủ kh bỏ bữa ,",
                    "juu dấuu."
                ];
                
                let startY = canvas.height / 2 - 30;
                let lineHeight = 35;
                
                for(let i = 0; i < lines.length; i++) {
                    ctx.fillText(lines[i], canvas.width / 2, startY + (i * lineHeight));
                }
            }

            ctx.font = "bold italic 18px Arial";    
            ctx.fillStyle = "#D8B4F8"; 
            ctx.textAlign = "left";            
            ctx.shadowColor = "#A855F7"; 
            ctx.shadowBlur = 10;
            ctx.fillText("Tom WiBuu ~", 25, canvas.height - 35);
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
